<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - StarPicks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2 style="text-align:center;">Acceso Administrador</h2>

<div style="max-width:400px; margin:auto; padding:20px; background:#111; border-radius:10px;">
    <input id="email" type="email" placeholder="Correo" required>
    <input id="password" type="password" placeholder="Contraseña" required>
    <button id="loginBtn">Ingresar</button>

    <p id="msg" style="color:red; text-align:center; margin-top:10px;"></p>
</div>

<script type="module" src="auth.js"></script>

</body>
</html>
