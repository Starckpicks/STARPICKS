<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarPicks - Público v3</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* FIX DEFINITIVO PARA REACCIONES */
        .reacciones {
            display: flex !important;
            flex-direction: row !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 25px !important;
            padding: 10px 0 !important;
        }
    </style>
</head>
<body>

<header>
    <h1>StarPicks</h1>
    <p>Jugadas Públicas (v3)</p>
</header>

<section id="lista">
    <h2>Jugadas Registradas</h2>

    <!-- ⭐ CONTADOR POR PERSONA ÚNICA ⭐ -->
    <div style="text-align:center; margin-bottom:15px; color:#00eaff; font-weight:bold;">
        Visitantes únicos:
        <span id="visitCounter">0</span>
    </div>

    <table id="tablaJugadas">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Competición</th>
                <th>Partido</th>
                <th>Cuota</th>
                <th>Stake</th>
                <th>Pronósticos</th>
                <th>Resultado Final</th>
                <th>Reacciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<!-- Firebase para página pública -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCHYnDqtxzA9nrqFEkZNELtIuonVpBJUsk",
        authDomain: "starpicks-8a477.firebaseapp.com",
        projectId: "starpicks-8a477",
        storageBucket: "starpicks-8a477.firebasestorage.app",
        messagingSenderId: "444164019875",
        appId: "1:444164019875:web:20651ceffabba3446d1116",
        measurementId: "G-13407KYWJ8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.firebaseDB = db;
</script>

<!-- ⭐ CONTADOR POR PERSONA ÚNICA ⭐ -->
<script type="module">
    import { doc, getDoc, setDoc, updateDoc, increment }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const db = window.firebaseDB;

    async function contadorUnico() {
        try {
            // 1️⃣ Revisar si el usuario ya tiene un ID guardado
            let userId = localStorage.getItem("starpicks_user");

            // 2️⃣ Si NO tiene → crear uno nuevo
            if (!userId) {
                userId = crypto.randomUUID();
                localStorage.setItem("starpicks_user", userId);

                // 3️⃣ Sumar +1 en Firebase
                const ref = doc(db, "stats", "unique_visits");
                const snap = await getDoc(ref);

                if (!snap.exists()) {
                    await setDoc(ref, { count: 1 });
                    document.getElementById("visitCounter").textContent = 1;
                } else {
                    await updateDoc(ref, { count: increment(1) });
                    const newSnap = await getDoc(ref);
                    document.getElementById("visitCounter").textContent = newSnap.data().count;
                }
            } else {
                // 4️⃣ Si ya tiene ID → solo mostrar el contador
                const ref = doc(db, "stats", "unique_visits");
                const snap = await getDoc(ref);

                if (snap.exists()) {
                    document.getElementById("visitCounter").textContent = snap.data().count;
                }
            }

        } catch (e) {
            console.error("Error contador único:", e);
        }
    }

    contadorUnico();
</script>

<!-- Script público -->
<script type="module" src="public.js"></script>

</body>

</body>
